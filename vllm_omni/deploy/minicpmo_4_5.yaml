async_chunk: true
connectors:
  connector_of_shared_memory:
    extra:
      initial_codec_chunk_frames: 3
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      connector_get_max_wait: 300
      connector_get_max_wait_first_chunk: 3000
      connector_get_sleep_s: 0.002
      token2wav_float16: true
      token2wav_n_timesteps: 2
      enable_hift_warmup: true
      talker_local_decode_stage_id: 1
      talker_local_decode_steps: 8
      talker_local_cpu_slot_mapping: true
      talker_binary_argmax: true
      talker_debug_trace: 0
      talker_dump_dir: /root/r5/dump_k2
      talker_e3: 0
    name: SharedMemoryConnector
enable_prefix_caching: false
pipeline: minicpmo_4_5
platforms:
  npu:
    stages:
    - compilation_config:
        cudagraph_mode: FULL_DECODE_ONLY
        cudagraph_capture_sizes: [8, 16, 32, 64]
      additional_config:
        ascend_compilation_config:
          enable_static_kernel: true
      max_num_batched_tokens: 8192
      stage_id: 0
    - compilation_config:
        cudagraph_mode: FULL_DECODE_ONLY
        cudagraph_capture_sizes: [1, 2, 4, 8]
      additional_config:
        ascend_compilation_config:
          enable_static_kernel: true
      max_num_batched_tokens: 8192
      stage_id: 1
stages:
- default_sampling_params:
    detokenize: true
    max_tokens: 32
    repetition_penalty: 1.0
    seed: 42
    temperature: 0.0
    top_k: -1
    top_p: 1.0
  speculative_config:
    method: ngram
    num_speculative_tokens: 10
    prompt_lookup_max: 5
    prompt_lookup_min: 1
  async_scheduling: false
  devices: '0'
  enforce_eager: false
  gpu_memory_utilization: 0.55
  interleave_mm_strings: true
  limit_mm_per_prompt:
    audio: 64
    image: 96
    video: 1
  max_model_len: 32768
  max_num_batched_tokens: 16384
  max_num_seqs: 8
  media_io_kwargs:
    video:
      fps: 1
      num_frames: 128
  stage_id: 0
  tensor_parallel_size: 1
- default_sampling_params:
    detokenize: false
    max_tokens: 512
    min_tokens: 50
    seed: 42
    stop_token_ids:
    - 1
    temperature: 0.0
    top_k: -1
    top_p: 1.0
  devices: '0'
  async_scheduling: false
  enforce_eager: false
  gpu_memory_utilization: 0.15
  max_model_len: 4096
  max_num_batched_tokens: 8192
  max_num_seqs: 8
  output_connectors:
    to_stage_2: connector_of_shared_memory
  stage_id: 1
- compilation_config:
    cudagraph_mode: PIECEWISE
  default_sampling_params:
    detokenize: true
    max_tokens: 65536
    temperature: 0.0
    top_k: -1
    top_p: 1.0
  devices: '0'
  additional_config:
    code2wav_enable_npu_graph: true
    code2wav_max_npu_graphs: 32
    enable_hift_npu_graph: true
    hift_npu_graph_max_graphs: 8
  enable_chunked_prefill: false
  enforce_eager: true
  gpu_memory_utilization: 0.18
  input_connectors:
    from_stage_1: connector_of_shared_memory
  max_model_len: 65536
  max_num_batched_tokens: 65536
  max_num_seqs: 8
  stage_id: 2
trust_remote_code: true
